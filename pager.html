<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="robots" content="noindex">
<title>発信|メディア文化ゼミナール 2026</title>
<style>
  :root{
    --ink:#22201d;
    --paper:#faf8f4;
    --accent:#b8431a;
    --line:#d9d2c7;
    --sub:#6f6a62;
    --panel:#2b2622;
  }
  *{box-sizing:border-box;-webkit-tap-highlight-color:transparent;}
  html,body{height:100%;}
  body{
    margin:0;
    background:var(--paper);
    color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.7;
    font-size:16px;
    -webkit-user-select:none;user-select:none;
  }
  .wrap{max-width:420px;margin:0 auto;padding:16px 16px 40px;}
  .site{font-size:11px;letter-spacing:.12em;color:var(--sub);text-align:center;margin-bottom:10px;}

  .screen{
    background:var(--panel);
    color:#e8e2d8;
    border-radius:10px;
    padding:16px 16px 14px;
    min-height:132px;
    display:flex;flex-direction:column;justify-content:space-between;
  }
  .stat{font-size:12px;letter-spacing:.1em;color:#b6ad9f;min-height:18px;}
  .stat b{color:#ffb08a;font-weight:normal;}
  .digits{
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:26px;letter-spacing:.14em;
    word-break:break-all;line-height:1.35;
    min-height:36px;color:#fff;
  }
  .count{font-size:12px;color:#b6ad9f;text-align:right;font-variant-numeric:tabular-nums;}
  .bell{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:30px;letter-spacing:.3em;color:#fff;min-height:40px;}

  .guide{
    font-size:13px;color:var(--sub);
    margin:14px 2px 12px;min-height:40px;
  }
  .guide strong{color:var(--accent);font-weight:600;}

  .bells{
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    font-size:14px;letter-spacing:.16em;color:var(--sub);
    text-align:center;margin:0 0 12px;
  }

  .pad{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:4px;}
  .pad button{
    font-family:inherit;
    font-size:26px;
    padding:16px 0 12px;
    background:#fff;
    border:1px solid var(--line);
    border-radius:8px;
    color:var(--ink);
    cursor:pointer;
    line-height:1;
  }
  .pad button .sub{display:block;font-size:9px;letter-spacing:.12em;color:var(--sub);margin-top:5px;}
  .pad button:active{background:#f0ebe3;}
  .pad button:disabled{opacity:.3;}

  .row{display:flex;gap:10px;margin-top:14px;}
  .row button{flex:1;}
  button.act{
    font-family:inherit;font-size:16px;padding:15px 10px;border-radius:8px;cursor:pointer;
    background:var(--accent);color:#fff;border:none;letter-spacing:.06em;
  }
  button.act:disabled{opacity:.35;}
  button.ghost{
    font-family:inherit;font-size:14px;padding:15px 10px;border-radius:8px;cursor:pointer;
    background:transparent;color:var(--sub);border:1px solid var(--line);
  }
  .hook{width:100%;font-size:18px;padding:22px 10px;}
  .note{font-size:11px;color:var(--sub);margin-top:18px;line-height:1.6;}
  .hide{display:none !important;}
</style>
</head>
<body>
<div class="wrap">

<div class="site">メディア文化ゼミナール 2026</div>

<div class="screen">
  <div class="stat" id="stat">受話器を置いています</div>
  <div class="digits" id="disp"></div>
  <div class="count" id="count"></div>
</div>

<div class="guide" id="guide">下のボタンで受話器を上げてください。</div>

<button class="act hook" id="hookBtn">受話器を上げる</button>

<div id="padWrap" class="hide">
  <p class="bells hide" id="bellList"></p>
  <div class="pad" id="pad">
    <button data-k="1">1</button><button data-k="2">2</button><button data-k="3">3</button>
    <button data-k="4">4</button><button data-k="5">5</button><button data-k="6">6</button>
    <button data-k="7">7</button><button data-k="8">8</button><button data-k="9">9</button>
    <button data-k="*">＊<span class="sub">こめ</span></button><button data-k="0">0</button><button data-k="#">＃</button>
  </div>
  <div class="row">
    <button class="ghost" id="downBtn">受話器を置く</button>
  </div>
</div>

<p class="note">
  訂正はできません。打ち間違えたら受話器を置いて、かけ直してください。<br>
  音が出ない場合、iPhoneは本体側面のマナースイッチを解除してください。
</p>

</div>

<script>
(function(){
  var TOPIC = 'mczemi26-pager-r7t3';
  var MAX = 20;

  /* ベル番号・カナ切替コード・送信キーは符号表と同じJSONから読む。授業中に差し替えできる */
  var BELLS = ['1111','2222','3333','4444','5555'];
  var KANACODE = '*2*2';   /* これを押すとカナ入力に切り替わる */
  var SENDCODE = '##';     /* 送信 */

  var AC = null, master = null, loop = null;
  var timers = [];
  var state = 'onhook';
  var bell = '', msg = '', codeBuf = '', sendBuf = '', kanaMode = false;
  var stage = 1, lastTraffic = 0;
  var CID = (function(){
    try {
      var v = localStorage.getItem('mc_pager_cid');
      if (!v){ v = String(Math.floor(Math.random()*1e9)); localStorage.setItem('mc_pager_cid', v); }
      return v;
    } catch(e){ return String(Math.floor(Math.random()*1e9)); }
  })();

  var elStat = document.getElementById('stat');
  var elDisp = document.getElementById('disp');
  var elCount = document.getElementById('count');
  var elGuide = document.getElementById('guide');
  var elBells = document.getElementById('bellList');
  var hookBtn = document.getElementById('hookBtn');
  var padWrap = document.getElementById('padWrap');
  var downBtn = document.getElementById('downBtn');

  fetch('./pager-table.json?nc=' + Date.now()).then(function(r){ return r.json(); }).then(function(j){
    if (j.bells && j.bells.length) BELLS = j.bells.map(String);
    if (j.kana) KANACODE = String(j.kana);
    if (j.send) SENDCODE = String(j.send);
  }).catch(function(){});

  function label(code){
    return String(code).split('').map(function(c){ return c === '*' ? '※' : (c === '#' ? '＃' : c); }).join('');
  }

  /* ---------- 音 ---------- */
  function initAudio(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      AC = new C();
      master = AC.createGain();
      master.gain.value = 0.3;
      master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  }
  function beep(f, dur, delay, gain){
    if (!AC) return;
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(); o.type = 'sine'; o.frequency.value = f;
    var g = AC.createGain();
    var v = (gain == null) ? 0.7 : gain;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.008);
    g.gain.setValueAtTime(v, t0 + dur - 0.008);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(master);
    o.start(t0); o.stop(t0 + dur + 0.03);
  }
  var DTMF = {
    '1':[697,1209],'2':[697,1336],'3':[697,1477],
    '4':[770,1209],'5':[770,1336],'6':[770,1477],
    '7':[852,1209],'8':[852,1336],'9':[852,1477],
    '*':[941,1209],'0':[941,1336],'#':[941,1477]
  };
  function dtmf(k){
    var f = DTMF[k]; if (!f || !AC) return;
    beep(f[0], 0.13, 0, 0.35); beep(f[1], 0.13, 0, 0.35);
  }
  function stopLoop(){ if (loop){ try { loop.stop(); } catch(e){} loop = null; } }

  function dialTone(){          /* 発信音 400Hz 連続 */
    stopLoop(); if (!AC) return;
    var o = AC.createOscillator(); o.frequency.value = 400;
    var g = AC.createGain(); g.gain.value = 0.35;
    o.connect(g); g.connect(master); o.start();
    loop = { stop: function(){ g.gain.setTargetAtTime(0, AC.currentTime, 0.01); o.stop(AC.currentTime + 0.12); } };
  }
  function ringback(){          /* 呼出音 400Hzを16Hzで変調、1秒オン2秒オフ */
    stopLoop(); if (!AC) return;
    var o = AC.createOscillator(); o.frequency.value = 400;
    var am = AC.createGain(); am.gain.value = 0.5;
    var lfo = AC.createOscillator(); lfo.frequency.value = 16;
    var lg = AC.createGain(); lg.gain.value = 0.5;
    lfo.connect(lg); lg.connect(am.gain);
    var env = AC.createGain(); env.gain.value = 0;
    o.connect(am); am.connect(env); env.connect(master);
    o.start(); lfo.start();
    var t = AC.currentTime;
    for (var i = 0; i < 12; i++){
      env.gain.setValueAtTime(0.55, t + i * 3);
      env.gain.setValueAtTime(0, t + i * 3 + 1);
    }
    loop = { stop: function(){
      env.gain.cancelScheduledValues(AC.currentTime);
      env.gain.setValueAtTime(0, AC.currentTime);
      o.stop(AC.currentTime + 0.05); lfo.stop(AC.currentTime + 0.05);
    } };
  }
  function busyTone(){          /* 話中音 400Hz 0.5秒オン0.5秒オフ */
    stopLoop(); if (!AC) return;
    var o = AC.createOscillator(); o.frequency.value = 400;
    var env = AC.createGain(); env.gain.value = 0;
    o.connect(env); env.connect(master); o.start();
    var t = AC.currentTime;
    for (var i = 0; i < 12; i++){
      env.gain.setValueAtTime(0.45, t + i);
      env.gain.setValueAtTime(0, t + i + 0.5);
    }
    loop = { stop: function(){
      env.gain.cancelScheduledValues(AC.currentTime);
      env.gain.setValueAtTime(0, AC.currentTime);
      o.stop(AC.currentTime + 0.05);
    } };
  }

  /* ---------- 進行 ---------- */
  function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
  function clearTimers(){ timers.forEach(clearTimeout); timers = []; }

  function render(){
    if (state === 'onhook'){
      elStat.textContent = '受話器を置いています';
      elDisp.textContent = '';
      elCount.textContent = '';
    } else if (state === 'dial'){
      elStat.textContent = 'ツーーーー';
      elDisp.className = 'bell';
      elDisp.textContent = bell.replace(/./g, '$& ').trim() || '';
      elCount.textContent = bell.length + ' / 4';
    } else if (state === 'msg'){
      elStat.innerHTML = kanaMode ? '<b>カナ入力</b>' : '<b>メッセージをどうぞ</b>';
      elDisp.className = 'digits';
      elDisp.textContent = msg;
      elCount.textContent = (kanaMode ? 'カナ  ' : '数字  ') + msg.length + ' / ' + MAX;
    }
  }

  function setGuide(html){ elGuide.innerHTML = html; }

  function padEnabled(on){
    var bs = document.getElementById('pad').querySelectorAll('button');
    for (var i = 0; i < bs.length; i++){ bs[i].disabled = !on; }
  }

  function goOnhook(silentMsg){
    clearTimers(); stopLoop();
    state = 'onhook'; bell = ''; msg = ''; codeBuf = ''; sendBuf = ''; kanaMode = false;
    elDisp.className = 'digits';
    padEnabled(true);
    padWrap.classList.add('hide');
    elBells.classList.add('hide');
    hookBtn.classList.remove('hide');
    hookBtn.disabled = false;
    hookBtn.textContent = '受話器を上げる';
    render();
    setGuide(silentMsg || '下のボタンで受話器を上げてください。');
  }

  hookBtn.addEventListener('click', function(){
    initAudio();
    clearTimers();
    state = 'dial'; bell = ''; msg = ''; codeBuf = ''; sendBuf = ''; kanaMode = false;
    hookBtn.classList.add('hide');
    padWrap.classList.remove('hide');
    elBells.textContent = BELLS.join('   ');
    elBells.classList.remove('hide');
    dialTone();
    render();
    setGuide('<strong>相手のベル番号(4桁)</strong>を押してください。');
  });

  downBtn.addEventListener('click', function(){ goOnhook(); });

  document.getElementById('pad').addEventListener('click', function(ev){
    var b = ev.target.closest('button[data-k]');
    if (!b) return;
    var k = b.getAttribute('data-k');

    if (state === 'dial'){
      if (k === '*' || k === '#') return;
      if (bell.length >= 4) return;
      dtmf(k);
      bell += k;
      render();
      if (bell.length === 4){ later(startCall, 400); }
      return;
    }

    if (state === 'msg'){
      dtmf(k);
      /* 送信コード(既定 ＃＃) */
      if (k === '#' || sendBuf){
        sendBuf += k;
        if (SENDCODE.indexOf(sendBuf) === 0){
          if (sendBuf === SENDCODE){ sendBuf = ''; codeBuf = ''; doSend(); return; }
          elStat.innerHTML = '<b>' + label(sendBuf) + '</b>';
          return;
        }
        sendBuf = '';
        render();
        return;
      }
      /* カナ切替コード(既定 ※2※2)。※で始まり、途中で外れたらやり直し */
      if (k === '*' || codeBuf){
        codeBuf += k;
        if (KANACODE.indexOf(codeBuf) === 0){
          if (codeBuf === KANACODE){
            codeBuf = '';
            kanaMode = true;
            setGuide('<strong>カナ入力に切り替わりました。</strong>符号表を見ながら、2桁ずつ押してください。<br>打ち終わったら <strong>' + label(SENDCODE) + '</strong> で送信です。');
            render();
            return;
          }
          elStat.innerHTML = '<b>' + label(codeBuf) + '</b>';
          return;
        }
        codeBuf = '';
        render();
        return;
      }
      if (k === '#' || k === '*') return;
      if (msg.length >= MAX) return;
      msg += k;
      render();
    }
  });

  function startCall(){
    state = 'ring';
    elCount.textContent = '';

    /* 使われていない番号 */
    if (BELLS.indexOf(bell) === -1){
      stopLoop();
      elStat.textContent = '(案内)';
      setGuide('<strong>おかけになった番号は、現在使われておりません。</strong><br>番号をお確かめのうえ、おかけ直しください。');
      later(function(){ busyTone(); }, 2600);
      later(function(){ goOnhook('切れました。かけ直してください。'); }, 6000);
      return;
    }

    elStat.textContent = 'プルルル…';
    setGuide('呼び出しています。');

    /* 輻輳。数秒内に他の誰かが送っていたら話中で弾く */
    if (stage >= 3 && (Date.now() - lastTraffic) < 7000){
      busyTone();
      elStat.textContent = 'お話し中';
      setGuide('<strong>お話し中です。</strong>しばらくしてからおかけ直しください。');
      later(function(){ goOnhook('切れました。かけ直してください。'); }, 4200);
      return;
    }

    ringback();
    later(function(){
      stopLoop();
      state = 'prompt';
      elStat.textContent = '(案内)';
      setGuide('ただいま呼び出しております。<br>発信音のあとにメッセージをどうぞ。');
      later(function(){
        beep(950, 0.45, 0, 0.5);   /* ピー */
        later(function(){
          state = 'msg';
          setGuide('数字を押してください。<strong>ここには数字しか出ません。</strong><br>打ち終わったら <strong>' +
                   label(SENDCODE) + '</strong> で送信です。');
          render();
        }, 500);
      }, 1600);
    }, 6200);
  }

  function doSend(){
    if (state !== 'msg' || msg.length === 0){
      elStat.textContent = 'メッセージがありません';
      later(render, 1200);
      return;
    }
    var digits = msg;
    var to = bell;
    state = 'sending';
    elStat.textContent = '送信中…';
    setGuide('送信しています。');
    var body = JSON.stringify({ type:'msg', to: to, cid: CID, digits: digits, mode: (kanaMode ? 'kana' : 'num'), ts: Date.now() });
    fetch('https://ntfy.sh/' + TOPIC, { method:'POST', body: body })
      .then(function(r){ if (!r.ok) throw new Error(r.status); return r; })
      .then(function(){
        beep(800, 0.12, 0, 0.5); beep(800, 0.12, 0.2, 0.5);
        state = 'done';
        elStat.textContent = '送信しました';
        elDisp.className = 'digits';
        elDisp.textContent = digits;
        elCount.textContent = to + ' あて / ' + digits.length + ' 桁 / ' + (kanaMode ? 'カナ' : '数字');
        setGuide('メッセージをお預かりしました。<strong>受話器をお切りください。</strong><br>訂正はできません。');
        padEnabled(false);
      })
      .catch(function(e){
        state = 'msg';
        elStat.textContent = '送信できませんでした';
        setGuide('<strong>つながりませんでした(' + e.message + ')。</strong>もう一度 ' + label(SENDCODE) + ' を押してください。');
      });
  }

  /* ---------- 制御信号と輻輳の監視 ----------
     since=6h で、あとから開いた端末にも現在の段階が届く。
     接続直後に流れてくる過去ぶんは輻輳の判定には使わない。 */
  var connectedAt = Date.now();
  try {
    var es = new EventSource('https://ntfy.sh/' + TOPIC + '/sse?since=6h');
    es.onopen = function(){ connectedAt = Date.now(); };
    es.onmessage = function(ev){
      try {
        var d = JSON.parse(ev.data);
        if (d.event !== 'message') return;
        var m = JSON.parse(d.message);
        if (m.type === 'ctrl' && m.stage){ stage = m.stage; return; }
        if (m.type === 'msg' && m.cid !== CID && (Date.now() - connectedAt) > 3000){
          lastTraffic = Date.now();
        }
      } catch(e){}
    };
  } catch(e){}

  goOnhook();
})();
</script>
</body>
</html>
