<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex, nofollow">
<title>受信|メディア文化ゼミナール 2026</title>
<style>
  :root{
    --bg:#151311;
    --panel:#221f1b;
    --ink:#efe9dd;
    --sub:#8d857a;
    --line:#3a342d;
    --accent:#ff8a4c;
    --lcd:#98b56a;
    --lcdbg:#2a3018;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;background:var(--bg);color:var(--ink);
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans","Noto Sans JP",sans-serif;
    line-height:1.6;
  }
  .bar{
    display:flex;align-items:center;gap:18px;flex-wrap:wrap;
    padding:12px 22px;border-bottom:1px solid var(--line);
  }
  .bar h1{font-size:15px;margin:0;font-weight:normal;letter-spacing:.14em;color:var(--sub);}
  .badge{font-size:15px;letter-spacing:.08em;}
  .badge b{color:var(--accent);font-size:22px;font-variant-numeric:tabular-nums;font-weight:normal;}
  .grow{flex:1;}
  .bar button{
    font-family:inherit;font-size:13px;padding:7px 13px;border-radius:6px;cursor:pointer;
    background:var(--panel);color:var(--ink);border:1px solid var(--line);
  }
  .bar button:hover{border-color:var(--accent);}
  .bar button.on{background:var(--accent);color:#1a1512;border-color:var(--accent);}

  /* ---- ポケベル本体 ---- */
  .stage{display:flex;align-items:center;justify-content:center;padding:40px 20px;min-height:calc(100vh - 120px);}
  .device{
    background:#d8d2c6;border-radius:22px;padding:26px 26px 20px;
    box-shadow:0 20px 60px rgba(0,0,0,.55), inset 0 2px 0 rgba(255,255,255,.5);
    width:min(1020px,94vw);
  }
  .lcd{
    background:var(--lcdbg);border-radius:6px;padding:26px 28px 22px;
    border:3px solid #6b6558;
  }
  .meta{
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    color:#7d9457;font-size:clamp(13px,1.6vw,20px);letter-spacing:.1em;
    display:flex;justify-content:space-between;margin-bottom:14px;
  }
  .line{
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;
    color:var(--lcd);
    font-size:clamp(20px,4.4vw,48px);
    letter-spacing:.08em;
    min-height:1.35em;line-height:1.35;
    white-space:pre;overflow:hidden;
  }
  .line.kana{
    font-family:"Hiragino Kaku Gothic ProN","Hiragino Sans",monospace;
    color:#c6e08a;letter-spacing:.18em;margin-top:10px;
    text-shadow:0 0 18px rgba(180,220,110,.28);
  }
  .lcdnote{color:#5f7343;font-size:clamp(11px,1.3vw,15px);margin-top:14px;letter-spacing:.08em;min-height:1.4em;}
  .devbar{display:flex;align-items:center;gap:16px;margin-top:18px;}
  .devbar .unread{color:#3c372e;font-size:14px;letter-spacing:.1em;}
  .devbar .unread b{color:#b8431a;font-size:20px;font-variant-numeric:tabular-nums;font-weight:normal;}
  .devbar .grow{flex:1;}
  .devbar button{
    font-family:inherit;font-size:15px;padding:11px 26px;border-radius:8px;cursor:pointer;
    background:#4a443a;color:#efe9dd;border:none;letter-spacing:.08em;
  }
  .devbar button:disabled{opacity:.35;cursor:default;}

  /* ---- ログ ---- */
  .log{max-width:1000px;margin:0 auto;padding:24px 22px 60px;}
  .item{
    border-bottom:1px solid var(--line);padding:14px 4px;display:flex;gap:18px;align-items:baseline;
  }
  .item .no{color:var(--accent);font-variant-numeric:tabular-nums;font-size:20px;min-width:3.4em;
    font-family:"SFMono-Regular",Menlo,Consolas,monospace;letter-spacing:.08em;}
  .item .tm{color:var(--sub);font-size:13px;min-width:5em;font-variant-numeric:tabular-nums;}
  .item .dg{font-family:"SFMono-Regular",Menlo,Consolas,monospace;font-size:19px;letter-spacing:.1em;color:#cdc5b6;flex:1;word-break:break-all;}
  .item .kn{font-size:23px;letter-spacing:.14em;color:#fff;min-width:9em;}
  .empty{color:var(--sub);text-align:center;padding:80px 0;font-size:15px;}

  /* ---- QR ---- */
  #qr{
    position:fixed;inset:0;background:#fff;display:none;
    align-items:center;justify-content:center;flex-direction:column;gap:22px;z-index:50;cursor:pointer;
  }
  #qr.on{display:flex;}
  #qr .cap{color:#22201d;font-size:20px;letter-spacing:.1em;}
  #qr .url{color:#6f6a62;font-size:14px;font-family:"SFMono-Regular",Menlo,Consolas,monospace;}
  .hide{display:none !important;}
</style>
</head>
<body>

<div class="bar">
  <h1>受信</h1>
  <span class="badge">着信 <b id="total">0</b></span>
  <span class="badge">未読 <b id="unreadTop">0</b></span>
  <span class="grow"></span>
  <button id="s1">段階1 数字</button>
  <button id="s2">段階2 かな</button>
  <button id="s3">段階3 輻輳</button>
  <button id="qrBtn">送信ページQR</button>
  <button id="viewBtn">ログ表示</button>
  <button id="csvBtn">CSV</button>
  <button id="clrBtn">記録を消す</button>
</div>

<div class="stage" id="pagerView">
  <div class="device">
    <div class="lcd">
      <div class="meta"><span id="mFrom">— — — —</span><span id="mTime"></span></div>
      <div class="line" id="lDigits"></div>
      <div class="line kana" id="lKana"></div>
      <div class="lcdnote" id="lNote">着信を待っています</div>
    </div>
    <div class="devbar">
      <span class="unread">未読 <b id="unread">0</b> 件</span>
      <span class="grow"></span>
      <button id="nextBtn" disabled>次を読む</button>
    </div>
  </div>
</div>

<div class="log hide" id="logView">
  <div id="logList"></div>
  <div class="empty" id="logEmpty">まだ着信はありません。</div>
</div>

<div id="qr">
  <div id="qrBox"></div>
  <div class="cap">送信ページ</div>
  <div class="url">mediaculture2026.github.io/pager.html</div>
</div>

<script>
(function(){
  var TOPIC = 'mczemi26-pager-r7t3';
  var P = new URLSearchParams(location.search);
  var DELAY = parseInt(P.get('delay') || '4500', 10);   /* 到達までの遅延 */
  var RESOLVE = 1400;                                   /* 数字が出てからかなが解けるまで */
  var view = (P.get('view') === 'log') ? 'log' : 'pager';

  var TABLE = {}, DAKU_OK = {}, HAN_OK = {};
  var list = [], unread = 0, shownIdx = -1, resolveTimer = null;

  var DAKU = {'か':'が','き':'ぎ','く':'ぐ','け':'げ','こ':'ご','さ':'ざ','し':'じ','す':'ず','せ':'ぜ','そ':'ぞ',
              'た':'だ','ち':'ぢ','つ':'づ','て':'で','と':'ど','は':'ば','ひ':'び','ふ':'ぶ','へ':'べ','ほ':'ぼ'};
  var HAN  = {'は':'ぱ','ひ':'ぴ','ふ':'ぷ','へ':'ぺ','ほ':'ぽ'};

  var el = function(id){ return document.getElementById(id); };

  /* ---------- 符号表 ---------- */
  fetch('./pager-table.json?nc=' + Date.now()).then(function(r){ return r.json(); }).then(function(j){
    (j.rows || []).forEach(function(r){ TABLE[r[0]] = r[1]; });
    redraw();
  }).catch(function(){});

  function decode(digits){
    var out = '', i = 0;
    while (i < digits.length){
      var p = digits.substr(i, 2);
      if (p.length < 2){ out += '?'; break; }
      var c = TABLE[p];
      i += 2;
      if (c === undefined){ out += '?'; continue; }
      if (c === '゛'){
        var prev = out.slice(-1);
        if (DAKU[prev]) out = out.slice(0, -1) + DAKU[prev]; else out += '゛';
        continue;
      }
      if (c === '゜'){
        var pv = out.slice(-1);
        if (HAN[pv]) out = out.slice(0, -1) + HAN[pv]; else out += '゜';
        continue;
      }
      out += c;
    }
    return out;
  }

  /* ---------- 保存 ---------- */
  function save(){ try { localStorage.setItem('mc_pager_log', JSON.stringify(list)); } catch(e){} }
  function load(){
    try { list = JSON.parse(localStorage.getItem('mc_pager_log') || '[]') || []; } catch(e){ list = []; }
    if (list.length){ shownIdx = list.length - 1; }
  }

  /* ---------- 音 ---------- */
  var AC = null, master = null;
  function audio(){
    if (!AC){
      var C = window.AudioContext || window.webkitAudioContext;
      if (!C) return;
      AC = new C(); master = AC.createGain(); master.gain.value = 0.35; master.connect(AC.destination);
    }
    if (AC.state === 'suspended') AC.resume();
  }
  function beep(f, dur, delay, gain){
    if (!AC) return;
    var t0 = AC.currentTime + (delay || 0);
    var o = AC.createOscillator(); o.type = 'square'; o.frequency.value = f;
    var g = AC.createGain(); var v = (gain == null) ? 0.25 : gain;
    g.gain.setValueAtTime(0, t0);
    g.gain.linearRampToValueAtTime(v, t0 + 0.005);
    g.gain.setValueAtTime(v, t0 + dur - 0.005);
    g.gain.linearRampToValueAtTime(0, t0 + dur);
    o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.02);
  }
  function ring(){
    audio();
    for (var i = 0; i < 2; i++){
      beep(2400, 0.09, i * 0.42);
      beep(2400, 0.09, i * 0.42 + 0.16);
    }
  }
  document.addEventListener('click', audio, { once:false });

  /* ---------- 段階 ---------- */
  var stage = 1;
  try { stage = parseInt(localStorage.getItem('mc_pager_stage') || '1', 10); } catch(e){}
  function setStage(n, broadcast){
    stage = n;
    try { localStorage.setItem('mc_pager_stage', String(n)); } catch(e){}
    ['s1','s2','s3'].forEach(function(id, i){ el(id).classList.toggle('on', i + 1 === n); });
    if (broadcast){
      fetch('https://ntfy.sh/' + TOPIC, { method:'POST', body: JSON.stringify({ type:'ctrl', stage:n }) })
        .catch(function(){});
    }
    redraw();
  }
  el('s1').addEventListener('click', function(){ setStage(1, true); });
  el('s2').addEventListener('click', function(){ setStage(2, true); });
  el('s3').addEventListener('click', function(){ setStage(3, true); });

  /* ---------- 表示 ---------- */
  function two(n){ return (n < 10 ? '0' : '') + n; }
  function hhmm(ts){ var d = new Date(ts); return two(d.getHours()) + ':' + two(d.getMinutes()); }

  function showPager(idx, animate){
    if (resolveTimer){ clearTimeout(resolveTimer); resolveTimer = null; }
    var m = list[idx];
    if (!m){
      el('mFrom').textContent = '— — — —';
      el('mTime').textContent = '';
      el('lDigits').textContent = '';
      el('lKana').textContent = '';
      el('lNote').textContent = '着信を待っています';
      return;
    }
    el('mFrom').textContent = m.from.split('').join(' ');
    el('mTime').textContent = hhmm(m.at) + '  ( ' + (idx + 1) + ' / ' + list.length + ' )';
    el('lDigits').textContent = m.digits;
    el('lNote').textContent = m.digits.length + ' 桁';
    var kana = (stage >= 2) ? decode(m.digits) : '';
    if (!animate || !kana){
      el('lKana').textContent = kana;
      return;
    }
    el('lKana').textContent = '';
    resolveTimer = setTimeout(function(){
      var i = 0;
      (function step(){
        i++;
        el('lKana').textContent = kana.slice(0, i);
        if (i < kana.length) resolveTimer = setTimeout(step, 130);
      })();
    }, RESOLVE);
  }

  function showLog(){
    var box = el('logList');
    box.innerHTML = list.map(function(m, i){
      var kana = (stage >= 2) ? decode(m.digits) : '';
      return '<div class="item"><span class="no">' + m.from + '</span>' +
             '<span class="tm">' + hhmm(m.at) + '</span>' +
             '<span class="dg">' + m.digits + '</span>' +
             '<span class="kn">' + kana + '</span></div>';
    }).join('');
    el('logEmpty').classList.toggle('hide', list.length > 0);
    window.scrollTo(0, document.body.scrollHeight);
  }

  function counters(){
    el('total').textContent = list.length;
    el('unread').textContent = unread;
    el('unreadTop').textContent = unread;
    el('nextBtn').disabled = (unread === 0);
  }
  function redraw(){
    counters();
    if (view === 'pager') showPager(shownIdx, false); else showLog();
  }

  el('nextBtn').addEventListener('click', advance);
  document.addEventListener('keydown', function(e){
    if (e.key === ' ' || e.key === 'ArrowRight'){ e.preventDefault(); advance(); }
    if (e.key === 'Escape'){ el('qr').classList.remove('on'); }
  });
  function advance(){
    if (unread === 0) return;
    shownIdx = list.length - unread;
    unread--;
    counters();
    showPager(shownIdx, true);
  }

  /* ---------- 受信 ---------- */
  function arrive(m){
    setTimeout(function(){
      list.push(m); save(); ring();
      unread++;
      if (view === 'pager') counters(); else redraw();
    }, DELAY);
  }

  try {
    var es = new EventSource('https://ntfy.sh/' + TOPIC + '/sse');
    es.onmessage = function(ev){
      try {
        var d = JSON.parse(ev.data);
        if (d.event !== 'message') return;
        var m = JSON.parse(d.message);
        if (m.type !== 'msg') return;
        arrive({ from: String(m.from || '????'), digits: String(m.digits || ''), at: Date.now() });
      } catch(e){}
    };
  } catch(e){}

  /* ---------- ボタン ---------- */
  el('viewBtn').addEventListener('click', function(){
    view = (view === 'pager') ? 'log' : 'pager';
    el('pagerView').classList.toggle('hide', view !== 'pager');
    el('logView').classList.toggle('hide', view !== 'log');
    el('viewBtn').textContent = (view === 'pager') ? 'ログ表示' : 'ポケベル表示';
    if (view === 'pager'){ unread = 0; }
    redraw();
  });
  el('csvBtn').addEventListener('click', function(){
    var rows = [['受信時刻','発信番号','数字列','解読']];
    list.forEach(function(m){
      var d = new Date(m.at);
      rows.push([d.toLocaleString('ja-JP'), m.from, m.digits, decode(m.digits)]);
    });
    var csv = '﻿' + rows.map(function(r){
      return r.map(function(c){ return '"' + String(c).replace(/"/g,'""') + '"'; }).join(',');
    }).join('\r\n');
    var a = document.createElement('a');
    a.href = URL.createObjectURL(new Blob([csv], { type:'text/csv' }));
    a.download = 'pager_log.csv';
    a.click();
  });
  el('clrBtn').addEventListener('click', function(){
    if (!confirm('受信記録をすべて消します。よろしいですか。')) return;
    list = []; unread = 0; shownIdx = -1;
    try { localStorage.removeItem('mc_pager_log'); } catch(e){}
    redraw();
  });
  el('qrBtn').addEventListener('click', function(){
    var n = QR_PAGER.n, s = 12;
    el('qrBox').innerHTML = '<svg width="' + (n*s) + '" height="' + (n*s) + '" viewBox="0 0 ' + n + ' ' + n +
      '" shape-rendering="crispEdges"><rect width="' + n + '" height="' + n + '" fill="#fff"/>' +
      '<path d="' + QR_PAGER.d + '" fill="#000"/></svg>';
    el('qr').classList.add('on');
  });
  el('qr').addEventListener('click', function(){ el('qr').classList.remove('on'); });

  /* ---------- 起動 ---------- */
  load();
  el('pagerView').classList.toggle('hide', view !== 'pager');
  el('logView').classList.toggle('hide', view !== 'log');
  el('viewBtn').textContent = (view === 'pager') ? 'ログ表示' : 'ポケベル表示';
  setStage(stage, false);
  redraw();
  if (view === 'pager') showPager(shownIdx, false);
})();
</script>
</body>
</html>
